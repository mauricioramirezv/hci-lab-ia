name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: node tests/tools/check-architecture.cjs
      - run: node tests/tools/check-translations.cjs
      - run: npm test -- --reporter=default --reporter=junit --outputFile=tests/results/vitest.xml
      - run: npm run build
      - name: Downloadable quality reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ github.run_attempt }}
          path: |
            tests/results/vitest.xml
            tests/reports/coverage/
          retention-days: 14
          if-no-files-found: ignore
