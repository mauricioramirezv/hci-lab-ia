name: End-to-end and accessibility
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Downloadable Playwright reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports-${{ github.run_attempt }}
          path: |
            tests/reports/playwright/
            tests/results/playwright/
          retention-days: 14
          if-no-files-found: ignore
